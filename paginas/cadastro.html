<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../estilo/cadastro.css">
    <title>Cadastre-se</title>
</head>
<body>
    <header>
        <h1>AVOG - Associação de Voleibol Guarulhense</h1>
        <nav>
           <a href="../index.html">Início</a> |
           <a href="times.html">Times</a> |
           <a href="sobre.html">Sobre</a> |
           <a href="login.html">Login</a>
        </nav>
    </header>
    <main>
        <div class="box">
            <form action="grava.jsp" name = "cadastroforms" method = "post" class="cadastroforms">
                <div class="cadastro">
                    <label for="nome" id="labelNome">Nome :</label>
                    <input type="text" name="txtNome" id="nome" class="input" charset="UTF-8" oninput="rejeitarNumeros(this)">
                </div>
                <div class="cadastro">
                    <label for="idade" id="labelidade"> Idade :</label>
                    <input type="text" name="txtIdade" id="idade" class="input" maxlength="2" oninput="somenteNumeros(this)">
                </div>
                <div class="cadastro">
                    <label for="telefone" id="labelTel">Telefone :</label>
                    <input type="text" name="txtTel" id="telefone" class="input" maxlength="11" oninput="somenteNumeros(this)">
                </div>
                <div class="cadastro">
                    <label for="cpf" id="labelCpf">CPF :</label>
                    <input type="text" name="txtCpf" id="cpf" class="input" maxlength="11" oninput="somenteNumeros(this)">
                </div>
                <div class="cadastro">
                    <label for="email" id="labelEmail">Email :</label>
                    <input type="email" name="txtEmail" id="email" class="input">
                </div>
                <div class="cadastro">
                    <label for="senha" id="labelSenha">Senha :</label>
                    <input type="password" name="senha" id="senha" class="input" maxlength="10">
                </div>
                <div class="cadastro">
                    <label for="confirmsenha" id="labelConfirmar">Confirmar Senha :</label>
                    <input type="password" name="txtSenha" id="confirmsenha" class="input">
                </div>
                <input type="button" value="Cadastrar" id="Cadastrar" class="Cadastrar" onclick="cadastrar()">
            </form>
        </div>
    </main>

    <script>
        function rejeitarNumeros(input) {
            input.value = input.value.replace(/[0-9]/g, '');
        }

        function somenteNumeros(input) {
            input.value = input.value.replace(/[^0-9]/g, '');
        }

        function cadastrar(){
            let nome = document.getElementById ("nome").value 
            let idade = document.getElementById ("idade").value
            let telefone = document.getElementById ("telefone").value 
            let cpf = document.getElementById ("cpf").value 
            let email = document.getElementById ("email").value
            let senha = document.getElementById ("senha").value
            let confirmsenha = document.getElementById("confirmsenha").value
            let enviar = true

            if(nome.length <3 || nome.length == 0){
                alert("Nome inválido")
                document.getElementById("labelNome").style.color = "red"
                document.getElementById("nome").style.borderColor = "red"
                enviar = false
            }

            if(idade.length == 0){
                alert("Idade inválida")
                document.getElementById("labelidade").style.color = "red"
                document.getElementById("idade").style.borderColor = "red"
                enviar = false
            }

            if(telefone.length <11 || telefone.length == 0){
                alert("telefone inválido")
                document.getElementById("labelTel").style.color = "red"
                document.getElementById("telefone").style.borderColor = "red"
                enviar = false
            }

            if(cpf.length < 11 || cpf.length == 0){
                alert("CPF inválido")
                document.getElementById("labelCpf").style.color = "red"
                document.getElementById("cpf").style.borderColor = "red"
                enviar = false
            }

            if(email.length == 0 || email.indexOf("@")<0 || email.trim() == ''){
                alert("Email inválido")
                document.getElementById("labelEmail").style.color = "red"
                document.getElementById("email").style.borderColor = "red"
                enviar = false
            }

            if(senha.length < 8 || senha.length == 0){
                alert("Senha inválida")
                document.getElementById("labelSenha").style.color = "red"
                document.getElementById("senha").style.borderColor = "red"
                enviar = false
            }

            if(confirmsenha != senha || senha.length == 0){
                alert("Senhas diferentes")
                document.getElementById("labelConfirmar").style.color = "red"
                document.getElementById("confirmsenha").style.borderColor = "red"
                enviar = false
            }

            if(enviar == true){
               document.cadastroforms.submit()
            } else{
                alert("Preencha todos os campos corretamente")
            }

        }
    </script>
</body>
</html>
